<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des élèves</title>
    <link rel="stylesheet" href="eleves.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="left"><span>MS</span></div>
    <nav>
        <a href="index.html">Classes</a>
        <a href="eleves.html">Élèves</a>
    </nav>
    <div class="right">Enseignant : Léa Dupuis</div>
</header>

<div class="main">

    <a class="back-arrow" href="index.html">←</a>

    <h1 id="titre-classe">Gestion des élèves</h1>

    <div class="search-area">
        <label>Classe</label>
        <select id="select-classe">
            <option value="6A">6° A</option>
            <option value="6C">6° C</option>
            <option value="4C">4° C</option>
            <option value="3C">3° C</option>
            <option value="5B">5° B</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="tbody-eleves">
            </tbody>
        </table>
    </div>

</div>

<footer>
    <a href="#">Support</a>
    <a href="#">FAQ</a>
    <a href="#">Aide</a>
</footer>

<script>
const eleves = {
  '6A': [
    { nom: 'CICUTTINI', prenom: 'Nino' },
    { nom: 'MARTIN', prenom: 'Emma' },
    { nom: 'BERNARD', prenom: 'Lucas' },
    { nom: 'DUBOIS', prenom: 'Léa' },
  ],
  '6C': [
    { nom: 'SOUAL', prenom: 'Clara' },
    { nom: 'PETIT', prenom: 'Hugo' },
    { nom: 'MOREAU', prenom: 'Inès' },
    { nom: 'SIMON', prenom: 'Tom' },
  ],
  '4C': [
    { nom: 'ROBERT', prenom: 'Camille' },
    { nom: 'RICHARD', prenom: 'Nathan' },
    { nom: 'LAURENT', prenom: 'Zoé' },
  ],
  '3C': [
    { nom: 'LEFEVRE', prenom: 'Antoine' },
    { nom: 'GARCIA', prenom: 'Manon' },
    { nom: 'THOMAS', prenom: 'Raphaël' },
  ],
  '5B': [
    { nom: 'ROUX', prenom: 'Jade' },
    { nom: 'DAVID', prenom: 'Théo' },
    { nom: 'MARTINEZ', prenom: 'Chloé' },
  ]
};

const nomClasse = {
  '6A': '6° A', '6C': '6° C', '4C': '4° C', '3C': '3° C', '5B': '5° B'
};

const profClasse = {
  '6A': 'M. Delfosse', '6C': 'C. Félicie', '4C': 'J. Dupont', '3C': 'P. Fradet', '5B': 'D. Ponthier'
};

// Lire le paramètre ?classe= dans l'URL (ou aucun si on vient du header)
const params = new URLSearchParams(window.location.search);
const classeParam = params.get('classe');
let classe = classeParam || '6A';

// Pré-sélectionner le menu déroulant
const select = document.getElementById('select-classe');
select.value = classe;

// Quand on change la classe dans le menu
select.addEventListener('change', function() {
  window.location.href = 'eleves.html?classe=' + this.value;
});

function afficherEleves(cl) {
  document.getElementById('titre-classe').textContent = 'Classe ' + (nomClasse[cl] || cl) + ' — ' + (profClasse[cl] || '');

  const tbody = document.getElementById('tbody-eleves');
  tbody.innerHTML = '';
  const liste = eleves[cl] || [];

  liste.forEach(function(eleve) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${eleve.nom}</td>
      <td>${eleve.prenom}</td>
      <td><a class="notes-link" href="notes.html?nom=${eleve.nom}&prenom=${eleve.prenom}&classe=${cl}" style="cursor:pointer;">Voir notes</a></td>
    `;
    tbody.appendChild(tr);
  });

  const lignesVides = 7 - liste.length;
  for (let i = 0; i < lignesVides; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td>';
    tbody.appendChild(tr);
  }
}

afficherEleves(classe);
</script>

</body>
</html>
